<!doctype html>
<!--
  Chapter 12, administration: machines: the figures of spec/screens/admin-machines.md.
  Each <figure class="shot" id="…"> becomes spec/screens/img/<id>.png:
    node scripts/render-mockups.mjs ch12 [id …]
  The look is screens.css, the frame is frame.js, the icons are icons.js. The
  design system's components are the <ds-*> tags, which ds.js expands into the
  package's own markup.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>away · 12 administration: machines</title>
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* a tab's content: its parts one under the other */
  .tab { display: flex; flex-direction: column; gap: 16px; }
  .tab .text code { white-space: nowrap; }
  .mk { margin-left: -8px; padding-left: 8px; }
  .mkr { margin-right: -8px; padding-right: 8px; }
  /* the way back to the list, set on the page's left edge */
  .back { margin: -4px 0 -4px -12px; align-self: flex-start; }
  /* a machine's page: its head, then its cards in two columns */
  .mhead { display: flex; align-items: center; gap: 14px; }
  .mhead > svg.i { width: 28px; height: 28px; color: var(--cloud-blue); stroke-width: 1.75; }
  .mhead .main { display: flex; flex-direction: column; gap: 3px; }
  .mhead .mname { font: 600 20px/1.2 var(--ff-mono); color: var(--fg); }
  .mhead .sub { font: 400 13px/1.4 var(--ff-ui); color: var(--fg-muted); }
  .mhead .end { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .cols > div { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .nc-card .text { font-size: 13px; color: var(--fg-muted); }
  .nc-card .facts + .text { margin-top: 12px; }
  .facts dd code { white-space: nowrap; }
  /* the programs a machine offers, and the rules that give it: short lists in a card */
  .plist { display: flex; flex-wrap: wrap; gap: 8px; }
  .plist span { height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border-2); background: var(--surface-2);
                font: 500 13px/1 var(--ff-ui); color: var(--fg); }
  .plist svg.i { width: 14px; height: 14px; color: var(--fg-muted); }
  .rlist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; font: 400 14px/1.4 var(--ff-ui); color: var(--fg-2); }
  .rlist a { font: 500 13px/1.4 var(--ff-mono); color: var(--cloud-blue); text-decoration: underline; text-underline-offset: 3px; margin-right: 8px; }
  /* an identity, as a machine shows it: one long number in two lines */
  .id-print { margin-top: 12px; }
  .nc-modal__body .label { display: block; margin: 0 0 6px; }
  .nc-modal__body .nc-code--block + .label { margin-top: 16px; }
  .nc-modal__body .text { margin-top: 16px; font-size: 13px; }
  /* a test's steps, in a card */
  .nc-card .steps li { min-height: 0; }
</style>
</head>
