<!doctype html>
<!--
  Chapter 7, programs: the figures of spec/screens/programs.md.
  Each <figure class="shot" id="…"> becomes spec/screens/img/<id>.png:
    node scripts/render-mockups.mjs ch07 [id …]
  The look is screens.css; frame.js draws the session's bar (chapter 6 specifies
  it); remote.js draws the programs' windows. The design system's components are
  the <ds-*> tags, which ds.js expands into the package's own markup.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>away · 7 programs</title>
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* programs have no picture to size, so their bar is without that button */
  .sbar .sb-picture { display: none; }
  /* the strip of this machine's open windows, right under the bar: how one switches.
     Away's own, drawn as the bar draws its sessions */
  .sbar { box-shadow: none; }
  .wstrip { position: absolute; left: 0; right: 0; top: 48px; height: 36px; z-index: 29; display: flex; align-items: stretch; background: var(--surface);
            border-bottom: 1px solid var(--border-2); box-shadow: 0 8px 24px #00000073; }
  .wstrip .wchip { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-right: 1px solid var(--border); color: var(--fg-muted);
                   font: 500 12px/1 var(--ff-mono); white-space: nowrap; }
  .wstrip .wchip svg.i { width: 14px; height: 14px; }
  .wstrip .wchip:first-child { padding-left: 26px; }
  .wstrip .wchip.on { color: var(--fg); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--cloud-blue); }
  .wstrip .wchip.add { color: var(--fg-2); }
  .wstrip .wchip.add.on { color: var(--cloud-blue); box-shadow: none; }
  /* a point on the ground, for a note to mark */
  .spot { position: absolute; width: 8px; height: 8px; }
</style>
</head>
<body>

<!-- Figure 7.1 · two programs of one machine, each in a window of its own, on Away's ground -->
<figure class="shot" id="programs-computer">
  <div class="computer" data-bar="none">
    <div class="session" data-sbar="closed">
      <div class="w" data-w="doc" data-title="Reports – Q3 2026" style="left: 96px; top: 132px; width: 600px; height: 400px"></div>
      <div class="w front" data-w="sheet" data-title="Ledger – November" style="left: 300px; top: 200px; width: 860px; height: 540px" data-co="1" data-co-side="right"></div>
      <span class="spot" style="left: 44px; top: 640px" data-co="2"></span>
    </div>
  </div>
</figure>

<!-- Figure 7.2 · the bar, and under it the strip of this machine's open windows -->
<figure class="shot" id="programs-bar-computer">
  <div class="computer" data-bar="none" data-co-parts="stab:1:top">
    <div class="session" data-sbar="open" data-tabs="programs:fin-app-02,shell:build-01" data-as="as alex.urban">
      <div class="w" data-w="doc" data-title="Reports – Q3 2026" style="left: 96px; top: 132px; width: 600px; height: 400px"></div>
      <div class="w front" data-w="sheet" data-title="Ledger – November" style="left: 300px; top: 200px; width: 860px; height: 540px"></div>
      <div class="wstrip" data-co="2" data-co-side="right">
        <span class="wchip on" data-co="3"><i data-i="app-window"></i>Ledger – November</span>
        <span class="wchip"><i data-i="app-window"></i>Reports – Q3 2026</span>
        <span class="wchip add" data-co="4" data-co-side="top"><i data-i="plus"></i>program</span>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 7.3 · the programs the machine offers -->
<figure class="shot" id="programs-open-computer">
  <div class="computer" data-bar="none">
    <div class="session" data-sbar="open" data-tabs="programs:fin-app-02,shell:build-01" data-as="as alex.urban">
      <div class="w" data-w="doc" data-title="Reports – Q3 2026" style="left: 96px; top: 132px; width: 600px; height: 400px"></div>
      <div class="w front" data-w="sheet" data-title="Ledger – November" style="left: 300px; top: 200px; width: 860px; height: 540px"></div>
      <div class="wstrip">
        <span class="wchip on"><i data-i="app-window"></i>Ledger – November</span>
        <span class="wchip"><i data-i="app-window"></i>Reports – Q3 2026</span>
        <span class="wchip add on"><i data-i="plus"></i>program</span>
      </div>
      <ds-menu style="left: 347px; top: 88px; min-width: 200px" data-co="1" data-co-side="right">
        <ds-item icon="app-window"><span class="nc-keep-case">Ledger</span></ds-item>
        <ds-item icon="app-window"><span class="nc-keep-case">Mail</span></ds-item>
        <ds-item icon="app-window"><span class="nc-keep-case">Payroll</span></ds-item>
        <ds-item icon="app-window"><span class="nc-keep-case">Reports</span></ds-item>
      </ds-menu>
    </div>
  </div>
</figure>

<script src="ds.js"></script>
<script src="remote.js"></script>
<script src="frame.js"></script>
</body>
</html>
