<!doctype html>
<!--
  Chapter 7, programs: the figures of spec/screens/programs.md.
  Each <figure class="shot" id="…"> becomes spec/screens/img/<id>.png:
    node scripts/render-mockups.mjs ch07 [id …]
  The look is screens.css; frame.js draws the rail of a session with programs: its
  mark, its controls and its foot, around the windows a drawing writes; remote.js
  draws the programs' windows. The design system's components are the <ds-*> tags,
  which ds.js expands into the package's own markup.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>away · 7 programs</title>
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* a point on the ground, for a note to mark */
  .spot { position: absolute; width: 8px; height: 8px; }
  /* a program's windows are on Away's ground, and nothing of a desktop is around them */
  .session.prog { background: var(--bg); }
  /* the machine's reason for a program that didn't start, open: the banner's own toggle and block,
     which the design system has on a banner only */
  .plaunch .dtl { --nc-strip-border: var(--border-2); display: flex; flex-direction: column; align-items: flex-start; margin-top: -4px; }
  .plaunch .dtl .nc-strip__toggle { display: inline-flex; margin-left: -8px; }
  .plaunch .dtl .nc-strip__details { margin-top: 4px; align-self: stretch; }
</style>
</head>
<body>

<!-- Figure 7.1 · two programs of one machine, each in a window of its own, on Away's ground, beside the rail -->
<figure class="shot" id="programs-computer">
  <div class="computer" data-bar="none">
    <div class="session prog">
      <div class="prail" data-co="3">
        <span class="pr-win on" data-p="L" title="Ledger – November"></span>
        <span class="pr-win" data-p="R:b" title="Reports – Q3 2026"></span>
      </div>
      <div class="warea">
        <div class="w" data-w="doc" data-p="R:b" data-title="Reports – Q3 2026" style="left: 48px; top: 120px; width: 560px; height: 400px"></div>
        <div class="w front" data-w="sheet" data-p="L" data-title="Ledger – November" style="left: 260px; top: 196px; width: 810px; height: 540px" data-co="1" data-co-side="right"></div>
        <span class="spot" style="left: 96px; top: 640px" data-co="2" data-co-side="bottom"></span>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 7.2 · the rail: the mark, the window in front, another window, the controls, the tray, the keyboard and the time -->
<figure class="shot" id="programs-rail-computer">
  <div class="computer" data-bar="none" data-co-parts="pmark:1,pkeys:4,ptray:5,plang:6,pclock:7">
    <div class="session prog">
      <div class="prail" data-tray>
        <span class="pr-win" data-p="L" title="Ledger – Budget 2027" data-co="3"></span>
        <span class="pr-win on" data-p="L" title="Ledger – November" data-co="2"></span>
        <span class="pr-win" data-p="R:b" title="Reports – Q3 2026"></span>
      </div>
      <div class="warea">
        <div class="w" data-w="sheet" data-p="L" data-title="Ledger – Budget 2027" style="left: 48px; top: 96px; width: 700px; height: 460px"></div>
        <div class="w front" data-w="sheet" data-p="L" data-title="Ledger – November" style="left: 260px; top: 196px; width: 810px; height: 540px"></div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 7.3 · the machine's programs, from the mark: one that didn't start, and the way to the other machines -->
<figure class="shot" id="programs-open-computer">
  <div class="computer" data-bar="none">
    <div class="session prog">
      <div class="prail" data-on="launch">
        <span class="pr-win on" data-p="L" title="Ledger – November"></span>
        <span class="pr-win" data-p="R:b" title="Reports – Q3 2026"></span>
      </div>
      <div class="warea">
        <div class="w" data-w="doc" data-p="R:b" data-title="Reports – Q3 2026" style="left: 240px; top: 120px; width: 560px; height: 400px"></div>
        <div class="w front" data-w="sheet" data-p="L" data-title="Ledger – November" style="left: 330px; top: 196px; width: 700px; height: 540px"></div>
      </div>
      <div class="spanel plaunch" role="group" aria-label="programs of fin-app-02">
        <span class="h2">programs of fin-app-02</span>
        <div data-co="1" data-co-side="right">
          <span class="pl-row hover"><i data-i="app-window"></i><span class="grow nc-keep-case">Ledger</span></span>
          <span class="pl-row"><i data-i="app-window"></i><span class="grow nc-keep-case">Mail</span></span>
          <span class="pl-row"><i data-i="app-window"></i><span class="grow nc-keep-case">Payroll</span></span>
          <span class="pl-row"><i data-i="app-window"></i><span class="grow nc-keep-case">Reports</span></span>
        </div>
        <p class="said" data-co="2" data-co-side="right">Payroll didn't start on fin-app-02.</p>
        <div class="dtl" data-details="the machine does not find the program (its own code 0x00000003)"></div>
        <span class="pl-row more" data-co="3" data-co-side="right"><i data-i="monitor"></i><span class="grow">other machines</span></span>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 7.4 · the icons of the tray, beside the rail's foot -->
<figure class="shot" id="programs-tray-computer">
  <div class="computer" data-bar="none">
    <div class="session prog">
      <div class="prail" data-tray data-on="tray">
        <span class="pr-win on" data-p="L" title="Ledger – November"></span>
        <span class="pr-win" data-p="M:o" title="Inbox – Mail"></span>
      </div>
      <div class="warea">
        <div class="w" data-w="doc" data-p="M:o" data-title="Inbox – Mail" style="left: 240px; top: 120px; width: 560px; height: 400px"></div>
        <div class="w front" data-w="sheet" data-p="L" data-title="Ledger – November" style="left: 330px; top: 196px; width: 700px; height: 540px"></div>
      </div>
      <div class="spanel ptray" role="group" aria-label="the tray of fin-app-02" data-co="1" data-co-side="right">
        <div class="pt-grid">
          <span class="pt-icon hover" title="Mail – 3 new" data-co="2" data-co-side="bottom"><span class="pico o">M</span></span>
          <span class="pt-icon" title="Ledger – 2 reminders"><span class="pico">L</span></span>
          <span class="pt-icon" title="Updates"><span class="pico v">U</span></span>
        </div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 7.5 · on a phone: the window in front has the screen, and the rail waits at the left edge -->
<figure class="shot" id="programs-phone">
  <div class="phone" data-bar="none">
    <div class="session prog">
      <span class="pedge" data-co="2"></span>
      <div class="warea">
        <div class="w front" data-w="sheet" data-p="L" data-title="Ledger – November" style="left: 0; top: 0; width: 360px; height: 100%; border: 0; box-shadow: none" data-co="1" data-co-side="right"></div>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 7.6 · on a phone, the rail swiped in over the picture -->
<figure class="shot" id="programs-phone-rail">
  <div class="phone" data-bar="none">
    <div class="session prog">
      <div class="prail over" data-co="1">
        <span class="pr-win on" data-p="L" title="Ledger – November"></span>
        <span class="pr-win" data-p="L" title="Ledger – Budget 2027"></span>
        <span class="pr-win" data-p="R:b" title="Reports – Q3 2026"></span>
      </div>
      <div class="warea">
        <div class="w front" data-w="sheet" data-p="L" data-title="Ledger – November" style="left: 0; top: 0; width: 360px; height: 100%; border: 0; box-shadow: none"></div>
      </div>
      <div class="pscrim"></div>
      <span class="spot" style="left: 240px; top: 420px; z-index: 33" data-co="2" data-co-side="right"></span>
    </div>
  </div>
</figure>

<script src="ds.js"></script>
<script>
  // the machine's reason, open, as chapter 5 shows the reason of a step that failed
  for (const el of document.querySelectorAll('.dtl[data-details]')) {
    el.innerHTML = `<button type="button" class="nc-strip__toggle" aria-expanded="true">${DS.svg.stripCaret}details</button><div class="nc-strip__details"></div>`;
    el.querySelector('.nc-strip__details').textContent = el.dataset.details;
  }
</script>
<script src="remote.js"></script>
<script src="frame.js"></script>
</body>
</html>
