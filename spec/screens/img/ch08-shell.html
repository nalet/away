<!doctype html>
<!--
  Chapter 8, a shell: the figures of spec/screens/shell.md.
  Each <figure class="shot" id="…"> becomes spec/screens/img/<id>.png:
    node scripts/render-mockups.mjs ch08 [id …]
  The look is screens.css; frame.js draws the session's bar (chapter 6 specifies
  it, this chapter the two buttons a shell adds); remote.js draws what the shell
  shows, and two figures write their own lines. The design system's components
  are the <ds-*> tags, which ds.js expands into the package's own markup.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>away · 8 a shell</title>
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* a menu under one of the bar's buttons */
  .session > .nc-actionmenu { top: 52px; }
  /* the find field, over the top right of the shell */
  .findbar { position: absolute; z-index: 31; top: 56px; right: 16px; display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--surface);
             border: 1px solid var(--border-2); box-shadow: 0 8px 24px #00000073; }
  .findbar .nc-input { width: 220px; }
  .findbar .cnt { padding: 0 10px 0 8px; font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); white-space: nowrap; }
  /* a match that is not the current one: the same mark, quieter */
  .term .hm { background: rgba(242, 178, 51, .26); }
  /* how far back the shell is scrolled, at its foot, and where that is in all that went by */
  .backline { position: absolute; z-index: 28; left: 0; right: 0; bottom: 0; height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px;
              background: var(--bg-2); border-top: 1px solid var(--border-2); font: 500 12px/1 var(--ff-mono); color: var(--fg-muted); }
  .scrollv { position: absolute; z-index: 28; right: 0; top: 48px; bottom: 36px; width: 8px; }
  .scrollv i { position: absolute; left: 2px; right: 2px; top: 71%; height: 7%; background: var(--border-control); }
  /* a point of the shell, for a note to mark */
  .spot { position: absolute; width: 8px; height: 16px; }
</style>
</head>
<body>

<!-- Figure 8.1 · a shell: its text has the whole window -->
<figure class="shot" id="shell-computer">

    <div class="session" data-sbar="closed">
      <div class="remote term" data-term="shell" data-co="2"></div>
    </div>
  </div>
</figure>

<figure class="shot" id="shell-bar-computer">

    <div class="session" data-sbar="open" data-tabs="shell:build-01,desktop:fin-app-02" data-as="as alex">
      <div class="remote term" data-term="shell"></div>
    </div>
  </div>
</figure>

        <ds-field label="Colours" data-co="3" data-co-side="right"><ds-select value="dark"></ds-select></ds-field>
      </div>
    </div>
  </div>
</figure>

<!-- Figure 8.6 · pasting several lines asks first -->
<figure class="shot" id="shell-paste-computer">
  <div class="computer" data-bar="none">
    <div class="session" data-sbar="closed">
      <div class="remote term" data-term="shell"></div>
      <ds-modal title="paste 4 lines?" width="520" data-co-in=".nc-modal__title 1, .nc-code 2, .nc-modal__footer 3">
        <ds-body>
          <p class="text" style="margin-bottom: 12px">The shell runs each line as soon as it arrives.</p>
          <ds-code block>cd ~/src/billing
git pull --rebase
cargo build --release
sudo systemctl restart billing</ds-code>
        </ds-body>
        <ds-footer><ds-button variant="ghost">cancel</ds-button><ds-button variant="primary">paste</ds-button></ds-footer>
      </ds-modal>
    </div>
  </div>
</figure>
