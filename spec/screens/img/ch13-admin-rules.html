<!doctype html>
<!--
  Chapter 13, administration: rules: the figures of spec/screens/admin-rules.md.
  Each <figure class="shot" id="…"> becomes spec/screens/img/<id>.png:
    node scripts/render-mockups.mjs ch13 [id …]
  The look is screens.css, the frame is frame.js, the icons are icons.js. The
  design system's components are the <ds-*> tags, which ds.js expands into the
  package's own markup.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>away · 13 administration: rules</title>
<link rel="stylesheet" href="screens.css">
<script src="icons.js"></script>
<style>
  /* a tab's content: its parts one under the other */
  .tab { display: flex; flex-direction: column; gap: 16px; }
  /* a mark on a line of text that starts at the page's edge stands a little off it */
  .mk { margin-left: -8px; padding-left: 8px; }
  /* the way back to the list, set on the page's left edge */
  .back { margin: -4px 0 -4px -12px; align-self: flex-start; }
  .nc-card .text { font-size: 13px; color: var(--fg-muted); }
  .nc-card .facts + .text { margin-top: 12px; }
  /* a group's or a machine's name, as it is written in the files */
  .id { font: 400 13px/1.4 var(--ff-mono); color: var(--fg); }
  /* what a person reaches: the field, then who it is */
  .ask { display: flex; align-items: center; gap: 16px; }
  .ask .nc-input { width: 360px; flex: none; }
  .person { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); }
  .person .main { display: flex; flex-direction: column; gap: 3px; margin-right: 32px; }
  .person .sub { font: 400 13px/1.4 var(--ff-ui); color: var(--fg-muted); }
  .person .facts { grid-template-columns: max-content max-content; gap: 6px 16px; }
  .person .facts dd { font-size: 13px; }
  /* where the answer would be, with nothing in it */
  .none { border: 1px solid var(--border); background: var(--surface); }
</style>
</head>
<body>

<!-- Figure 13.1 · the rules in force, and the roles -->
<figure class="shot" id="admin-rules-computer">
  <div class="computer" data-view="administration" data-role="admin">
    <div class="pg">
      <div class="pghead"><span class="h1">administration</span></div>
      <ds-tabs><ds-tab>machines</ds-tab><ds-tab selected>rules</ds-tab><ds-tab>sessions</ds-tab><ds-tab>records</ds-tab><ds-tab>status</ds-tab></ds-tabs>
      <div style="margin-top: 24px">
        <div class="tab">
          <div class="row">
            <p class="text grow">In force since 13 November 2026, 09:02, when the files were last applied. To change a rule, change its file.</p>
            <ds-button icon="user-check" data-co="1" data-co-side="right">what a person reaches</ds-button>
          </div>
          <ds-table label="rules" data-co-in="thead 2">
            <ds-head>
              <ds-th sort="ascending" width="212px">rule</ds-th><ds-th width="150px">who</ds-th><ds-th width="216px">reaches</ds-th>
              <ds-th width="186px">clipboard</ds-th><ds-th width="158px">ends unused after</ds-th><ds-th>file</ds-th>
            </ds-head>
            <ds-tr>
              <ds-td><span class="id">admins-engineering</span></ds-td><ds-td>away-admins</ds-td><ds-td><ds-idcell title="engineering" text="a group of 3 machines"></ds-idcell></ds-td>
              <ds-td>from the machine only</ds-td><ds-td>never</ds-td><ds-td><ds-code>rules/access.yaml</ds-code></ds-td>
            </ds-tr>
            <ds-tr>
              <ds-td><span class="id">audit-finance</span></ds-td><ds-td>away-audit</ds-td><ds-td><ds-idcell title="fin-app-02" text="a machine"></ds-idcell></ds-td>
              <ds-td>off</ds-td><ds-td>30 min</ds-td><ds-td><ds-code>rules/access.yaml</ds-code></ds-td>
            </ds-tr>
            <ds-tr>
              <ds-td><span class="id">design-mac</span></ds-td><ds-td>design</ds-td><ds-td><ds-idcell title="mac-design-01" text="a machine"></ds-idcell></ds-td>
              <ds-td>to the machine only</ds-td><ds-td>30 min</ds-td><ds-td><ds-code>rules/access.yaml</ds-code></ds-td>
            </ds-tr>
            <ds-tr>
              <ds-td><span class="id">engineering-machines</span></ds-td><ds-td>engineering</ds-td><ds-td><ds-idcell title="engineering" text="a group of 3 machines"></ds-idcell></ds-td>
              <ds-td>both ways</ds-td><ds-td>2 h</ds-td><ds-td><ds-code>rules/access.yaml</ds-code></ds-td>
            </ds-tr>
            <ds-tr>
              <ds-td><span class="id">finance-desktops</span></ds-td><ds-td>finance</ds-td><ds-td><ds-idcell title="finance" text="a group of 2 machines"></ds-idcell></ds-td>
              <ds-td>both ways</ds-td><ds-td>30 min</ds-td><ds-td><ds-code>rules/access.yaml</ds-code></ds-td>
            </ds-tr>
          </ds-table>
          <ds-card title="roles" data-co="3">
            <ds-aside><ds-code>rules/access.yaml</ds-code></ds-aside>
            <dl class="facts"><dt>Administrators</dt><dd><span class="id">away-admins</span></dd><dt>Readers of the records</dt><dd><span class="id">away-audit</span></dd></dl>
            <p class="text">Everyone else who signs in reaches what a rule gives them, and sees nothing of the administration.</p>
          </ds-card>
        </div>
      </div>
    </div>
  </div>
</figure>
