# Away, as one workspace: the program, its three parts, and the libraries they are built from.
[workspace]
resolver = "2"
members = [
    "crates/away",
    "crates/away-part",
    "crates/away-server",
    "crates/away-gateway",
    "crates/away-issuer",
    "crates/away-secret",
    "crates/away-rdp",
    "crates/away-winauth",
    "crates/away-wire",
    "crates/away-try",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/nalet/away"
publish = false

# every library Away is built from directly, each with what it is for. scripts/libraries.py
# writes docs/libraries.md from these lines and fails when one says nothing.
[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync"] } # runs many connections at once
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] } # speaks HTTP to browsers, to the cluster's checks and to the sign-in service
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] } # lets hyper use tokio's connections and timers
http-body-util = { version = "0.1", default-features = false } # holds the body of an HTTP answer
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] } # secures the connection to a machine and to the sign-in service: TLS is never Away's own
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] } # lets rustls secure tokio's connections
webpki-roots = { version = "1", default-features = false } # the public authorities a sign-in service's certificate is checked against, since the image holds no others
ring = { version = "0.17", default-features = false } # checks the signature on what a sign-in service signed
sha2 = { version = "0.11", default-features = false } # makes the fingerprint a machine is known by, and binds a sign-in to its connection
md4 = { version = "0.11", default-features = false } # turns a password into the key Windows knows it by: part of signing in with a name and a password
md-5 = { version = "0.11", default-features = false } # the hash that signing in with a name and a password is built on
hmac = { version = "0.13", default-features = false } # makes the proofs and the keys of signing in with a name and a password
rc4 = { version = "0.2", default-features = false } # the cipher that signing in with a name and a password seals its messages with, and the taking of a licence too
sha1 = { version = "0.11", default-features = false } # the second hash that the taking of a licence makes its keys and its checks with
num-bigint = { version = "0.5", default-features = false } # does the arithmetic of the old RSA step in taking a licence, which the protocol defines as it is
aes = { version = "0.9", default-features = false } # the cipher Kerberos seals its messages with: part of signing in on a Windows machine with a certificate
getrandom = { version = "0.4", default-features = false } # takes random bytes from the system, for keys and for numbers used once
saphyr-parser = { version = "0.3", default-features = false } # reads the files of machines and rules, which are YAML, and knows the line each thing is written in
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] } # carries a session between a browser and the gateway: the WebSocket
png = { version = "0.18", default-features = false } # packs what a machine draws into pictures a browser reads by itself
futures-util = { version = "0.3", default-features = false, features = ["sink"] } # lets the gateway take and send a session's messages one by one
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] } # speaks to the database: the client that most programs in this language use
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] } # lets rustls secure the connection to the database

away-secret = { path = "crates/away-secret" }
away-part = { path = "crates/away-part" }
away-server = { path = "crates/away-server" }
away-gateway = { path = "crates/away-gateway" }
away-issuer = { path = "crates/away-issuer" }
away-rdp = { path = "crates/away-rdp" }
away-winauth = { path = "crates/away-winauth" }
away-wire = { path = "crates/away-wire" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
