{{- /*
What secures what Away's parts ask of each other: an authority of this installation's
own, and a certificate of it for the address the gateway asks the server at. Both are
made when the chart is installed and kept as they are by every update. The authority's
key is kept nowhere, so nothing else can ever be certified by it. To have new ones,
remove the secret and update.
*/ -}}
{{- $name := printf "%s-between-parts" (include "away.name" .) -}}
{{- $server := printf "%s-server" (include "away.name" .) -}}
{{- $held := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $held = .data | default dict -}}
{{- end }}
{{- if not (and (index $held "authority.pem") (index $held "server.pem") (index $held "server-key.pem")) }}
{{- $authority := genCA "away, between its parts" 3650 -}}
{{- $names := list $server (printf "%s.%s" $server .Release.Namespace) (printf "%s.%s.svc" $server .Release.Namespace) -}}
{{- $certificate := genSignedCert $server nil $names 3650 $authority -}}
{{- $held = dict "authority.pem" ($authority.Cert | b64enc) "server.pem" ($certificate.Cert | b64enc) "server-key.pem" ($certificate.Key | b64enc) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "away.labels" (dict "root" .) | nindent 4 }}
type: Opaque
data:
  authority.pem: {{ index $held "authority.pem" }}
  server.pem: {{ index $held "server.pem" }}
  server-key.pem: {{ index $held "server-key.pem" }}
{{- if include "away.issuerAnswers" . }}
{{- /*
And what secures what the gateway asks the issuer, where the installation names a
domain or keeps secrets for machines: an authority of its own, and a certificate of it
for the issuer's address. They
are made and kept as the ones above are.
*/ -}}
{{- $name := printf "%s-to-the-issuer" (include "away.name" .) -}}
{{- $issuer := printf "%s-issuer" (include "away.name" .) -}}
{{- $held := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $held = .data | default dict -}}
{{- end }}
{{- if not (and (index $held "authority.pem") (index $held "issuer.pem") (index $held "issuer-key.pem")) }}
{{- $authority := genCA "away, to its issuer" 3650 -}}
{{- $names := list $issuer (printf "%s.%s" $issuer .Release.Namespace) (printf "%s.%s.svc" $issuer .Release.Namespace) -}}
{{- $certificate := genSignedCert $issuer nil $names 3650 $authority -}}
{{- $held = dict "authority.pem" ($authority.Cert | b64enc) "issuer.pem" ($certificate.Cert | b64enc) "issuer-key.pem" ($certificate.Key | b64enc) -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "away.labels" (dict "root" .) | nindent 4 }}
type: Opaque
data:
  authority.pem: {{ index $held "authority.pem" }}
  issuer.pem: {{ index $held "issuer.pem" }}
  issuer-key.pem: {{ index $held "issuer-key.pem" }}
{{- end }}
{{- if and (include "away.keeps" .) (not .Values.keeping.secretName) }}
{{- /*
And the key the passwords Away keeps for machines are sealed to, with a certificate of it.
Made once, at the first install, and kept: every issuer of the installation reads the
key, every server the certificate. It stays when Away is removed, since without it no
kept password opens again: back it up with the database.
*/ -}}
{{- $name := include "away.keepingSecret" . -}}
{{- $held := dict -}}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $held = .data | default dict -}}
{{- end }}
{{- if not (and (index $held "key.pem") (index $held "certificate.pem")) }}
{{- $key := genPrivateKey "rsa" -}}
{{- $certificate := genSelfSignedCertWithKey "away, the key the passwords it keeps are sealed to" nil nil 36500 $key -}}
{{- $held = dict "key.pem" ($key | b64enc) "certificate.pem" ($certificate.Cert | b64enc) -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "away.labels" (dict "root" .) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key.pem: {{ index $held "key.pem" }}
  certificate.pem: {{ index $held "certificate.pem" }}
{{- end }}
