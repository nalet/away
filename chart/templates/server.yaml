{{- /* The server: the pages and the requests. The way in leads everything but a session's connection here. */ -}}
{{- $told := list -}}
{{- $mounts := list -}}
{{- with .Values.signIn }}
{{- if or .service .client .secretName }}
{{- /* the sign-in service is named whole or not at all */ -}}
{{- $address := required "signIn needs the address people reach Away at: set address" $.Values.address -}}
{{- $told = append $told (dict "name" "AWAY_PUBLIC_ADDRESS" "value" (printf "https://%s" $address)) -}}
{{- $told = append $told (dict "name" "AWAY_SIGN_IN_SERVICE" "value" (required "signIn.service is not set" .service)) -}}
{{- $told = append $told (dict "name" "AWAY_SIGN_IN_CLIENT" "value" (required "signIn.client is not set" .client)) -}}
{{- $told = append $told (dict "name" "AWAY_SIGN_IN_SECRET_FILE" "value" "/run/away/sign-in/secret") -}}
{{- $told = append $told (dict "name" "AWAY_SIGN_IN_ASKS_FOR" "value" .asksFor) -}}
{{- $told = append $told (dict "name" "AWAY_SIGN_IN_GROUPS" "value" .groupsEntry) -}}
{{- $secret := dict "secretName" (required "signIn.secretName is not set" .secretName) "items" (list (dict "key" "secret" "path" "secret")) -}}
{{- $mounts = append $mounts (dict "at" "/run/away/sign-in" "volume" (dict "name" "sign-in" "secret" $secret)) -}}
{{- if .authoritiesConfigMap }}
{{- $told = append $told (dict "name" "AWAY_SIGN_IN_AUTHORITIES_FILE" "value" "/run/away/authorities/authorities.pem") -}}
{{- $mounts = append $mounts (dict "at" "/run/away/authorities" "volume" (dict "name" "authorities" "configMap" (dict "name" .authoritiesConfigMap))) -}}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.administrators }}
{{- $told = append $told (dict "name" "AWAY_ADMINISTRATORS" "value" (join "," .)) -}}
{{- end }}
{{- with .Values.recordReaders }}
{{- $told = append $told (dict "name" "AWAY_RECORD_READERS" "value" (join "," .)) -}}
{{- end }}
{{- with .Values.contact }}
{{- $told = append $told (dict "name" "AWAY_CONTACT" "value" .) -}}
{{- end }}
{{- with .Values.farms }}
{{- if or .account .secretName .authoritiesConfigMap }}
{{- /* the account for the farms' feeds is named with its secret or not at all */ -}}
{{- $told = append $told (dict "name" "AWAY_FARMS_ACCOUNT" "value" (required "farms.account is not set" .account)) -}}
{{- $told = append $told (dict "name" "AWAY_FARMS_PASSWORD_FILE" "value" "/run/away/farms/password") -}}
{{- $secret := dict "secretName" (required "farms.secretName is not set" .secretName) "items" (list (dict "key" "password" "path" "password")) -}}
{{- $mounts = append $mounts (dict "at" "/run/away/farms" "volume" (dict "name" "farms" "secret" $secret)) -}}
{{- if .authoritiesConfigMap }}
{{- $told = append $told (dict "name" "AWAY_FARMS_AUTHORITIES_FILE" "value" "/run/away/farms-authorities/authorities.pem") -}}
{{- $mounts = append $mounts (dict "at" "/run/away/farms-authorities" "volume" (dict "name" "farms-authorities" "configMap" (dict "name" .authoritiesConfigMap))) -}}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.database }}
{{- if or .host .secretName .authoritiesConfigMap }}
{{- /* the database is named with the secret of its account or not at all */ -}}
{{- $told = append $told (dict "name" "AWAY_DATABASE_HOST" "value" (required "database.host is not set" .host)) -}}
{{- $told = append $told (dict "name" "AWAY_DATABASE_PORT" "value" (toString .port)) -}}
{{- $told = append $told (dict "name" "AWAY_DATABASE_NAME" "value" .name) -}}
{{- $told = append $told (dict "name" "AWAY_DATABASE_ACCOUNT" "value" .account) -}}
{{- $told = append $told (dict "name" "AWAY_DATABASE_PASSWORD_FILE" "value" "/run/away/database/password") -}}
{{- if not (has .connection (list "verified" "encrypted" "plain")) }}
{{- fail (printf "database.connection is verified, encrypted or plain, and not \"%v\"" .connection) }}
{{- end }}
{{- $told = append $told (dict "name" "AWAY_DATABASE_CONNECTION" "value" .connection) -}}
{{- $secret := dict "secretName" (required "database.secretName is not set" .secretName) "items" (list (dict "key" "password" "path" "password")) -}}
{{- $mounts = append $mounts (dict "at" "/run/away/database" "volume" (dict "name" "database" "secret" $secret)) -}}
{{- if .authoritiesConfigMap }}
{{- $told = append $told (dict "name" "AWAY_DATABASE_AUTHORITIES_FILE" "value" "/run/away/database-authorities/authorities.pem") -}}
{{- $mounts = append $mounts (dict "at" "/run/away/database-authorities" "volume" (dict "name" "database-authorities" "configMap" (dict "name" .authoritiesConfigMap))) -}}
{{- end }}
{{- end }}
{{- end }}
{{- /* the files of machines and rules, and the pictures they name as icons: from the values, or from a ConfigMap of the operator's own */ -}}
{{- if and (or .Values.files .Values.pictures) .Values.filesConfigMap }}
{{- fail "files or pictures, and filesConfigMap, are both set: the files of machines and rules come from one place" }}
{{- end }}
{{- $files := list -}}
{{- range $name := keys .Values.files | sortAlpha }}
{{- if not (regexMatch "^[-._a-zA-Z0-9]+(/[-._a-zA-Z0-9]+)*\\.ya?ml$" $name) }}
{{- fail (printf "files: \"%s\" is no name for a file of machines and rules: letters, digits, - _ . and folders, ending in .yaml" $name) }}
{{- end }}
{{- /* a ConfigMap's keys take no folders: the folders are in the path each key is mounted at */ -}}
{{- $files = append $files (dict "key" (replace "/" "__" $name) "path" $name) -}}
{{- end }}
{{- range $name := keys .Values.pictures | sortAlpha }}
{{- if not (regexMatch "^[-._a-zA-Z0-9]+(/[-._a-zA-Z0-9]+)*\\.png$" $name) }}
{{- fail (printf "pictures: \"%s\" is no name for a picture: letters, digits, - _ . and folders, ending in .png" $name) }}
{{- end }}
{{- $files = append $files (dict "key" (replace "/" "__" $name) "path" $name) -}}
{{- end }}
{{- if $files }}
{{- $told = append $told (dict "name" "AWAY_FILES" "value" "/etc/away/files") -}}
{{- $mounts = append $mounts (dict "at" "/etc/away/files" "volume" (dict "name" "files" "configMap" (dict "name" (printf "%s-files" (include "away.name" .)) "items" $files))) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "away.name" . }}-files
  labels:
    {{- include "away.labels" (dict "root" . "part" "server") | nindent 4 }}
data:
  {{- range $name := keys .Values.files | sortAlpha }}
  {{ replace "/" "__" $name }}: |
    {{- index $.Values.files $name | nindent 4 }}
  {{- end }}
{{- with .Values.pictures }}
binaryData:
  {{- range $name := keys . | sortAlpha }}
  {{ replace "/" "__" $name }}: {{ index $.Values.pictures $name | quote }}
  {{- end }}
{{- end }}
---
{{- else if .Values.filesConfigMap }}
{{- $told = append $told (dict "name" "AWAY_FILES" "value" "/etc/away/files") -}}
{{- $mounts = append $mounts (dict "at" "/etc/away/files" "volume" (dict "name" "files" "configMap" (dict "name" .Values.filesConfigMap))) -}}
{{- end }}
{{ include "away.part" (dict "root" . "part" "server" "port" 8080 "named" "http" "told" $told "mounts" $mounts) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "away.name" . }}-server
  labels:
    {{- include "away.labels" (dict "root" . "part" "server") | nindent 4 }}
spec:
  selector:
    {{- include "away.picks" (dict "root" . "part" "server") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
