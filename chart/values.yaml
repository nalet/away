# The values of an installation. Everything Away is told at installation is here.
# What each means is in the installation guide, docs/install.md.

# The address Away answers on, such as away.example.com. A way in needs it.
address: ""

# The organisation's sign-in service, which speaks OpenID Connect. Without it Away
# runs, and nobody can sign in.
signIn:
  # The service, as it names itself, such as https://sign-in.example.com/realms/staff
  service: ""
  # The name the service knows Away by.
  client: ""
  # The secret that holds what Away proves itself to the service with, under the key
  # "secret". It is made beside the chart, so that it is in no file of values.
  secretName: ""
  # A ConfigMap with the certificates of authorities to trust besides the public ones,
  # as PEM under the key "authorities.pem": for a service whose certificate is of the
  # organisation's own authority.
  authoritiesConfigMap: ""
  # What the service is asked to say of a person.
  asksFor: openid profile email
  # The entry of a sign-in that names the person's groups.
  groupsEntry: groups

# The groups whose people administer Away, and the groups whose people read its records.
administrators: []
recordReaders: []

# Whom people turn to when something fails, as the pages show it: it-help@example.com
contact: ""

# The machines, their groups and the rules, as files: each entry is a file's name and
# what the file holds. A name may have folders, such as machines/finance.yaml. Give them
# with --set-file, or in a file of values. Away applies a change as it arrives, whole or
# not at all.
files: {}
# The pictures the files name as icons: each entry is a picture's name, such as
# icons/ledger.png, and the picture itself in Base64. PNG, 256 KiB at most each.
pictures: {}
# Or a ConfigMap of one's own that holds the files and the pictures, each under its name.
filesConfigMap: ""

# The farms the files name say themselves what they publish: Away asks each farm's web
# access for its feed, as an account of its own. Without the account a farm in the
# files shows nothing, and the administration says so.
farms:
  # The account Away reads the feeds with, such as CORP\svc-away. It needs to see what
  # the farms publish, and nothing else: it opens no machine.
  account: ""
  # The secret that holds the account's password, under the key "password". It is made
  # beside the chart, so that it is in no file of values.
  secretName: ""
  # A ConfigMap with the certificates of authorities to trust besides the public ones,
  # as PEM under the key "authorities.pem": for a farm whose web access has a
  # certificate of the organisation's own authority.
  authoritiesConfigMap: ""

# The database: one PostgreSQL, which only the server reaches. Away keeps there what
# people star. Without it Away runs, keeps nothing, and the pages show no stars.
database:
  # The database server's name on the network, such as postgres.example.com
  host: ""
  port: 5432
  # The database of that server which is Away's, and the account the server signs in
  # as. The account makes Away's tables there itself, so it owns the database or may
  # create in it.
  name: away
  account: away
  # The secret that holds the account's password, under the key "password". It is made
  # beside the chart, so that it is in no file of values.
  secretName: ""
  # How the connection is secured:
  #   verified   the database shows a certificate for its name, of an authority that is
  #              trusted
  #   encrypted  the connection is encrypted and the certificate is not checked: for a
  #              database that shows a certificate no authority signed. Whoever can put
  #              themselves between the server and the database is not noticed
  #   plain      not secured: only for a network nobody else is on
  connection: verified
  # A ConfigMap with the certificates of authorities to trust besides the public ones,
  # as PEM under the key "authorities.pem": for a database whose certificate is of the
  # organisation's own authority.
  authoritiesConfigMap: ""

image:
  repository: ghcr.io/nalet/away
  # The image's tag. Empty takes the version of Away this chart was published with.
  tag: ""
  # The image's digest, sha256:... When set, the tag is not used.
  digest: ""
  pullPolicy: IfNotPresent
  # Secrets to pull the image with, where the registry asks for one: [{name: ...}]
  pullSecrets: []

# How Away is reached from outside the cluster: an ingress, a route, or neither.
ingress:
  enabled: false
  # The ingress controller's class. Empty takes the cluster's default.
  className: ""
  annotations: {}
  # The secret that holds the certificate for the address. Empty takes the ingress
  # controller's own.
  tlsSecret: ""

route:
  # For OpenShift, in place of an ingress.
  enabled: false
  # One's own certificate in place of the cluster's. Give the three with --set-file,
  # never in a file of values that is kept.
  certificate: ""
  key: ""
  caCertificate: ""
  # How long the router leaves a session's connection open while nothing passes.
  timeout: 1h

networkRules:
  # Allow the connections Away is built to make, and refuse every other one.
  enabled: true
  # Who may reach Away's address, as the peers of a NetworkPolicy. Empty takes the
  # cluster's router where a route is made, and every namespace otherwise.
  wayInFrom: []
  # Who may read the measures, as the peers of a NetworkPolicy. Empty lets nobody.
  measuresFrom: []
  # Where the sign-in service is, as the peers of a NetworkPolicy, and its port. Empty
  # takes any address: the server reaches that port and nothing else.
  signInServiceAt: []
  signInServicePort: 443
  # Where the farms' web access is, as the peers of a NetworkPolicy, and its port. Empty
  # takes any address: the server reaches that port and nothing else. It is used once
  # farms.account is set.
  farmsAt: []
  farmsPort: 443
  # Where the machines are, as the peers of a NetworkPolicy, and the ports their
  # desktops are opened on. Empty takes any address: the gateway reaches those ports
  # and nothing else. A machine whose file names another port needs that port here.
  machinesAt: []
  machinePorts: [3389]
  # Where the database is, as the peers of a NetworkPolicy. Empty takes any address: the
  # server reaches database.port and nothing else. It is used once database.host is set.
  databaseAt: []

monitoring:
  # Make a ServiceMonitor, so the Prometheus operator finds the measures by itself.
  # The cluster has to have that kind.
  serviceMonitor: false
  # Make alert rules that are ready to use. The cluster has to have that kind.
  alerts: false
  # Labels for both, where the monitoring picks its objects by label.
  labels: {}

# What each part may use. A request is what it is given for certain, a limit what it
# never gets more than.
server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
gateway:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 1Gi }
issuer:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# Where the parts run.
nodeSelector: {}
tolerations: []
