name: Build, test and publish Away

# on every change: the libraries Away is built from are checked, then the program's form,
# the compiler's warnings, its tests and the chart; a browser goes through the pages, with
# the keyboard alone and on a phone's screen, and each has to pass the accessibility
# checks and load nothing from outside; and the image is installed on a fresh
# Kubernetes cluster by someone with rights in one namespace alone, where
# tests/install/kubernetes.sh tries it and the connections the cluster has to refuse.
# Away is tried against real servers that the pipeline starts itself: a desktop over RDP
# on Linux, whose picture has to be the server's screen, pixel for pixel, and a sign-in
# service, at which a browser signs in by typing a name and a password.
#
# on the main branch and on a version's tag the image and the chart are then published:
# built for two kinds of processor, signed with this pipeline's own identity, with a
# record of how the image was built and a list of what it holds. docs/build.md says how
# anyone checks each, and the last job does it: with no right to the registry, it checks
# the signatures, the record and the list, and installs the published chart on a fresh
# cluster.
#
# every tool is fixed to one commit; the version it is, is beside it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check the program and the chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The libraries are listed, each with what it is for
        run: python3 scripts/libraries.py --check

      - name: What Away says it is built from is what the lock files say
        run: python3 scripts/contents.py --parts crates/away-server/built-from.json --check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: The pages, checked and built, to be part of the program
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build

      - name: The code's form
        run: cargo fmt --all --check

      - name: The compiler's warnings, which count as failures
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: A real database for the tests, which are tried against it first
        run: |
          KEEP=1 tests/machines/database/real.sh
          echo "AWAY_TEST_DATABASE=localhost:15432" >> "$GITHUB_ENV"

      - name: A real Kerberos server and a machine that takes its tickets, for the tests, which are tried against them first
        run: |
          KEEP=1 tests/machines/kerberos/real.sh
          echo "AWAY_TEST_KERBEROS=localhost:1088" >> "$GITHUB_ENV"
          echo "AWAY_TEST_KERBEROS_MACHINE=localhost:1089" >> "$GITHUB_ENV"

      - name: The tests
        run: cargo test --locked

      - name: The pages, gone through in a browser as a person does
        run: |
          cargo build --locked --package away-server --example pages --features stand-in
          npx --prefix web playwright install --with-deps chromium
          npm --prefix web test

      - name: The chart, with each way in
        run: |
          helm lint chart
          helm template away chart --namespace away > /dev/null
          helm template away chart --namespace away --set ingress.enabled=true --set address=away.example.com > /dev/null
          helm template away chart --namespace away --set route.enabled=true --set address=away.example.com \
            --set monitoring.serviceMonitor=true --set monitoring.alerts=true > /dev/null
          helm template away chart --namespace away --set ingress.enabled=true --set address=away.example.com \
            --set signIn.service=https://sign-in.example.com/realms/staff --set signIn.client=away \
            --set signIn.secretName=away-sign-in --set signIn.authoritiesConfigMap=away-authorities \
            --set 'administrators={away-admins}' --set contact=it-help@example.com > /dev/null
          # the files of machines and rules, from the values and from a ConfigMap of one's own
          helm template away chart --namespace away \
            --set-file 'files.machines/finance\.yaml=crates/away-server/tests/fixtures/files/machines/finance.yaml' \
            --set-file 'files.access\.yaml=crates/away-server/tests/fixtures/files/rules/access.yaml' | grep -q 'path: machines/finance.yaml'
          helm template away chart --namespace away \
            --set-file 'files.machines/finance\.yaml=crates/away-server/tests/fixtures/files/machines/finance.yaml' \
            --set "pictures.icons/ledger\.png=$(base64 < crates/away-server/tests/fixtures/files/icons/ledger.png | tr -d '\n')" \
            | grep -q 'path: icons/ledger.png'
          helm template away chart --namespace away --set filesConfigMap=away-files | grep -q 'name: AWAY_FILES'
          ! helm template away chart --namespace away --set filesConfigMap=away-files --set 'files.a\.yaml=x' 2> /dev/null
          # between the parts: an authority of the installation's own, a certificate for the address the
          # gateway asks the server at, and the way from the gateway to the server and to the machines
          helm template away chart --namespace away --set 'networkRules.machinePorts={3389,3390}' > "$RUNNER_TEMP/parts.yaml"
          grep -q 'name: away-between-parts' "$RUNNER_TEMP/parts.yaml"
          grep -A1 'name: AWAY_SERVER$' "$RUNNER_TEMP/parts.yaml" | grep -q 'value: https://away-server:8082'
          grep -q 'name: AWAY_INTERNAL_CERTIFICATE_FILE' "$RUNNER_TEMP/parts.yaml"
          grep -q 'name: away-gateway-to-server-and-machines' "$RUNNER_TEMP/parts.yaml"
          grep -q 'port: 3390' "$RUNNER_TEMP/parts.yaml"
          # the account that reads the farms' feeds: its secret, its authorities, and the way out to the farms
          helm template away chart --namespace away --set 'farms.account=CORP\\svc-away' --set farms.secretName=away-farms \
            --set farms.authoritiesConfigMap=away-farms-authorities > "$RUNNER_TEMP/farms.yaml"
          grep -q 'name: AWAY_FARMS_PASSWORD_FILE' "$RUNNER_TEMP/farms.yaml"
          grep -q 'name: AWAY_FARMS_AUTHORITIES_FILE' "$RUNNER_TEMP/farms.yaml"
          grep -q 'name: away-server-to-farms' "$RUNNER_TEMP/farms.yaml"
          ! helm template away chart --namespace away --set 'farms.account=CORP\\svc-away' 2> /dev/null
          # the database: its account's secret, its authorities, and the way out to it for the server alone
          helm template away chart --namespace away --set database.host=postgres.example.com --set database.secretName=away-database \
            --set database.authoritiesConfigMap=away-database-authorities --set database.port=5433 > "$RUNNER_TEMP/database.yaml"
          grep -q 'name: AWAY_DATABASE_PASSWORD_FILE' "$RUNNER_TEMP/database.yaml"
          grep -q 'name: AWAY_DATABASE_AUTHORITIES_FILE' "$RUNNER_TEMP/database.yaml"
          grep -A1 'name: AWAY_DATABASE_PORT' "$RUNNER_TEMP/database.yaml" | grep -q 'value: "5433"'
          grep -A1 'name: AWAY_DATABASE_CONNECTION' "$RUNNER_TEMP/database.yaml" | grep -q 'value: verified'
          grep -q 'name: away-server-to-database' "$RUNNER_TEMP/database.yaml"
          ! helm template away chart --namespace away --set database.host=postgres.example.com 2> /dev/null
          ! helm template away chart --namespace away --set database.host=postgres.example.com --set database.secretName=away-database \
            --set database.connection=unsecured 2> /dev/null
          # a sign-in service that is named in part is refused, and says what is missing
          ! helm template away chart --namespace away --set signIn.service=https://sign-in.example.com 2> /dev/null

      - name: The libraries' licences, known holes and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  install:
    name: install on a fresh Kubernetes cluster
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --build-arg AWAY_COMMIT=${{ github.sha }} --tag away:test .

      - name: The image holds the program and nothing else
        run: |
          docker create --name held away:test > /dev/null
          docker export held | tar --list | grep -v -E '^(dev|etc|proc|sys)(/|$)|^\.dockerenv$' > held.txt
          cat held.txt
          [ "$(cat held.txt)" = away ]
          [ "$(docker inspect --format '{{.Config.User}}' away:test)" = 65532:65532 ]
          docker run --rm away:test version

      - name: Start a cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: away

      - name: Give the cluster the image
        run: kind load docker-image away:test --name away

      - name: Install Away and try it
        run: tests/install/kubernetes.sh
        env:
          IMAGE_REPOSITORY: away
          IMAGE_TAG: test
          IMAGE_PULL_POLICY: Never

      # an ingress controller as a cluster has one, set to send on to https what arrives without
      - name: Give the cluster an ingress controller
        run: |
          helm install traefik traefik --repo https://traefik.github.io/charts --version 42.4.0 \
            --namespace ingress --create-namespace \
            --set service.spec.type=ClusterIP \
            --set ports.web.http.redirections.entryPoint.to=websecure \
            --set ports.web.http.redirections.entryPoint.scheme=https \
            --set ports.web.http.redirections.entryPoint.permanent=true \
            --wait --timeout 240s

      - name: Install Away behind it, with a certificate of one's own, and try it
        run: tests/install/kubernetes.sh
        env:
          NAMESPACE: away-behind
          INGRESS: ingress/traefik
          INGRESS_CLASS: traefik
          IMAGE_REPOSITORY: away
          IMAGE_TAG: test
          IMAGE_PULL_POLICY: Never

  machines:
    name: try real servers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: The pages, built to be part of the program
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build

      - name: Build the program and the test program
        run: cargo build --locked --package away --package away-try

      - name: A desktop over RDP on Linux
        run: tests/machines/linux/rdp.sh

      - name: A sign-in service, which a browser signs in at by typing a name and a password
        run: |
          npx --prefix web playwright install --with-deps chromium
          tests/machines/sign-in/real.sh

  publish:
    name: publish the image and the chart
    needs: [check, install, machines]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.name.outputs.version }}
      image: ${{ steps.name.outputs.image }}
      charts: ${{ steps.name.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name what is published
        id: name
        run: |
          # a tag publishes its version; the main branch publishes the version it is on
          # its way to, with the commit: 0.1.0-main.34d0117
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tagged=${GITHUB_REF_NAME#v}
            if [ "${tagged%%-*}" != "$version" ]; then
              echo "The tag $GITHUB_REF_NAME is not the version $version that Cargo.toml names." >&2
              exit 1
            fi
            version=$tagged
            tags="$image:$version"
          else
            version="$version-main.${GITHUB_SHA::7}"
            tags="$image:$version,$image:main"
          fi
          {
            echo "version=$version"
            echo "image=$image"
            echo "charts=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image for both kinds of processor, and publish it
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.tags }}
          build-args: AWAY_COMMIT=${{ github.sha }}
          # the record of the build and the list of contents are made below, by the
          # pipeline's own identity, and not by the builder
          provenance: false
          sbom: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        run: cosign sign --yes "${{ steps.name.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: Record how the image was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: List what the image holds
        run: python3 scripts/contents.py --output away.cdx.json

      - name: Attach the list to the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: away.cdx.json
          push-to-registry: true

      - name: Publish the chart, for this image, and sign it
        env:
          VERSION: ${{ steps.name.outputs.version }}
          CHARTS: ${{ steps.name.outputs.charts }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"
          helm package chart --version "$VERSION" --app-version "$VERSION" --destination out
          # the registry now and then doesn't find what was pushed a moment ago: once more, then
          set -o pipefail
          for attempt in 1 2 3; do
            if helm push "out/away-$VERSION.tgz" "oci://$CHARTS" 2>&1 | tee out/push.log; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          digest=$(sed -n 's/^Digest: //p' out/push.log)
          [ -n "$digest" ]
          cosign sign --yes "$CHARTS/away@$digest"

      - name: Say what was published
        env:
          VERSION: ${{ steps.name.outputs.version }}
          IMAGE: ${{ steps.name.outputs.image }}
          CHARTS: ${{ steps.name.outputs.charts }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE:$VERSION\` |"
            echo "| Its digest | \`$DIGEST\` |"
            echo "| Chart | \`oci://$CHARTS/away\`, version \`$VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: check what was published, as anyone can
    needs: publish
    runs-on: ubuntu-24.04
    # no right to the registry: what is checked here, anyone can check
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      IMAGE: ${{ needs.publish.outputs.image }}
      CHARTS: ${{ needs.publish.outputs.charts }}
      SIGNED_BY: ^https://github\.com/${{ github.repository }}/\.github/workflows/build\.yml@
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: The image and the chart are signed by this pipeline
        run: |
          for signed in "$IMAGE:$VERSION" "$CHARTS/away:$VERSION"; do
            cosign verify "$signed" --certificate-identity-regexp "$SIGNED_BY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "signed: $signed"
          done

      - name: The record of how the image was built names this commit
        run: |
          gh attestation verify "oci://$IMAGE:$VERSION" --repo "$GITHUB_REPOSITORY" --format json \
            | jq --exit-status --arg commit "$GITHUB_SHA" 'any(.[]; .verificationResult.signature.certificate.sourceRepositoryDigest == $commit)'

      - name: The list of what the image holds names every library with its licence
        run: |
          gh attestation verify "oci://$IMAGE:$VERSION" --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom --format json \
            | jq --raw-output '.[0].verificationResult.statement.predicate.components[] | [.name, (.version // "-"), (.licenses[0].expression // "NO LICENCE")] | @tsv' \
            | tee held.tsv
          [ "$(wc -l < held.tsv)" -ge 10 ]
          ! grep -q 'NO LICENCE' held.tsv

      - name: Start a cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: away

      - name: Install the published chart, with the published image, and try it
        run: tests/install/kubernetes.sh
        env:
          CHART: oci://${{ needs.publish.outputs.charts }}/away
          CHART_VERSION: ${{ needs.publish.outputs.version }}
          IMAGE_REPOSITORY: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.version }}
