saphyr-parser.workspace = true

[dev-dependencies]
away-server = { workspace = true, features = ["stand-in"] }

[[example]]
name = "pages"
required-features = ["stand-in"]

[[example]]
name = "farm"

[features]
# a sign-in service and a farm's web access that stand in for real ones, for tests
stand-in = ["away-rdp/stand-in"]

