[package]
name = "away-gateway"
description = "The gateway: the sessions, each with one connection to the browser and one to the machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
away-part.workspace = true
away-rdp.workspace = true
away-winauth.workspace = true
away-secret.workspace = true
hyper.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls.workspace = true
rustls.workspace = true
getrandom.workspace = true
away-wire.workspace = true
hyper-util.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
png.workspace = true

[dev-dependencies]
away-gateway = { workspace = true, features = ["stand-in"] }

[features]
# a machine that stands in for a real one, for tests
stand-in = ["away-rdp/stand-in", "away-winauth/stand-in"]

[lints]
workspace = true
