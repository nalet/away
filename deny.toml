# What the build refuses of the libraries Away is built from (cargo deny check):
# a licence that is not on this list, a known security hole, a version that was
# withdrawn, and a source other than the language's public registry.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # the licence of the list of public authorities, which is data and no code
    "CDLA-Permissive-2.0",
    # the licence of the pages' fonts, which scripts/libraries.py checks with the pages' libraries
    "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
